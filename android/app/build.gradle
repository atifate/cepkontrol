plugins { id 'com.android.application' }

android {
    namespace 'com.cepkontrol.host'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cepkontrol.host'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
