services:
  relay:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      MAX_ROOMS: 20
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
